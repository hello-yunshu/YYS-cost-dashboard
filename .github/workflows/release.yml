name: Build & Release

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        run: |
          gh run list --repo ${{ github.repository }} --workflow release.yml --json databaseId,createdAt -q '.[] | select((now - (.createdAt | sub("\\.[0-9]+Z$"; "Z") | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) > 14*86400) | .databaseId' \
            | xargs -r -I{} gh run delete {} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build Windows standalone EXE
        run: npm run build:exe

      - name: Verify standalone exe
        run: |
          $exePath = "dist-portable\Cost-Dashboard.exe"
          if (-not (Test-Path $exePath)) { throw "Standalone exe not found: $exePath" }
          $exeSize = [math]::Round((Get-Item $exePath).Length / 1MB, 1)
          Write-Host "Standalone exe size: $exeSize MB"
          if ($exeSize -lt 30) { throw "Standalone exe too small ($exeSize MB), expected >30 MB" }
          if ($exeSize -gt 300) { throw "Standalone exe too large ($exeSize MB), expected <300 MB" }
          $footerBytes = New-Object byte[] 4
          $fs = [System.IO.File]::OpenRead($exePath)
          $fs.Seek(-4, 'End') | Out-Null
          $fs.Read($footerBytes, 0, 4) | Out-Null
          $fs.Close()
          $magic = [System.Text.Encoding]::ASCII.GetString($footerBytes)
          if ($magic -ne 'CDSE') { throw "Standalone exe footer magic mismatch: got '$magic', expected 'CDSE'" }
          Write-Host "  OK: standalone exe with embedded payload (magic: $magic)"
          Write-Host "Windows build verification passed"

      - name: Smoke test Windows build
        run: |
          $env:DB_MODE = "sqljs"
          $env:DB_PATH = "$PWD\dist-portable\data\cost_dashboard.db"
          $env:UPLOADS_DIR = "$PWD\dist-portable\uploads"
          $env:NODE_ENV = "production"
          $env:PORT = "3113"
          New-Item -ItemType Directory -Force -Path "$PWD\dist-portable\data", "$PWD\dist-portable\uploads", "$PWD\dist-portable\logs" | Out-Null
          $proc = Start-Process -FilePath "$PWD\dist-portable\node\win-x64\node.exe" -ArgumentList "$PWD\dist-portable\app\server.bundle.js" -WorkingDirectory "$PWD\dist-portable\app" -PassThru
          Write-Host "Server PID: $($proc.Id)"
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:3113/api/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200 -and $resp.Content -match '"success":true') {
                $healthy = $true
                Write-Host "  OK: /api/health returned 200"
                break
              }
            } catch {}
            Write-Host "  Waiting... ($($i+1)s)"
          }
          if (-not $healthy) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Smoke test failed: /api/health did not respond within 30s"
          }
          try {
            $months = Invoke-RestMethod -Uri "http://localhost:3113/api/months" -TimeoutSec 5 -ErrorAction Stop
            Write-Host "  OK: /api/months responded"
          } catch { Write-Host "  WARN: /api/months failed: $_" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Windows smoke test passed"

      - name: Rename standalone exe
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "dist-portable\Cost-Dashboard.exe" "Cost-Dashboard-Windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: Cost-Dashboard-Windows-x64
          path: Cost-Dashboard-Windows-x64.exe
          retention-days: 7

  build-macos:
    needs: cleanup
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build macOS standalone DMG
        run: npm run build:dmg

      - name: Verify macOS build
        run: |
          DMG_FILE=$(ls dist-dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG_FILE" ]; then echo "::error::No DMG file found in dist-dmg/" && exit 1; fi
          DMG_SIZE=$(du -m "$DMG_FILE" | cut -f1)
          echo "DMG: $DMG_FILE ($DMG_SIZE MB)"
          if [ "$DMG_SIZE" -lt 80 ]; then echo "::error::DMG too small ($DMG_SIZE MB), expected >80 MB" && exit 1; fi
          if [ "$DMG_SIZE" -gt 400 ]; then echo "::error::DMG too large ($DMG_SIZE MB), expected <400 MB" && exit 1; fi
          APP_BUNDLE="dist-portable/Cost Dashboard.app"
          REQUIRED_PATHS=(
            "$APP_BUNDLE"
            "$APP_BUNDLE/Contents/MacOS/CostDashboardLauncher"
            "$APP_BUNDLE/Contents/Info.plist"
            "$APP_BUNDLE/Contents/Resources/app/server.bundle.js"
            "$APP_BUNDLE/Contents/Resources/app/dist-frontend/index.html"
            "$APP_BUNDLE/Contents/Resources/node/macos-arm64/bin/node"
            "$APP_BUNDLE/Contents/Resources/node/macos-x64/bin/node"
          )
          for p in "${REQUIRED_PATHS[@]}"; do
            if [ ! -e "$p" ]; then echo "::error::Missing: $p" && exit 1; fi
            echo "  OK: $p"
          done
          echo "macOS build verification passed"

      - name: Smoke test macOS build
        run: |
          export DB_MODE=sqljs
          export DB_PATH="$PWD/dist-portable/data/cost_dashboard.db"
          export UPLOADS_DIR="$PWD/dist-portable/uploads"
          export NODE_ENV=production
          export PORT=3113
          mkdir -p dist-portable/data dist-portable/uploads dist-portable/logs
          APP_BUNDLE="dist-portable/Cost Dashboard.app"
          "$APP_BUNDLE/Contents/Resources/node/macos-arm64/bin/node" "$APP_BUNDLE/Contents/Resources/app/server.bundle.js" &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          HEALTHY=false
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://localhost:3113/api/health 2>/dev/null | grep -q '"success":true'; then
              HEALTHY=true
              echo "  OK: /api/health returned 200"
              break
            fi
            echo "  Waiting... (${i}s)"
          done
          if [ "$HEALTHY" = "true" ]; then
            if curl -sf http://localhost:3113/api/months 2>/dev/null > /dev/null; then
              echo "  OK: /api/months responded"
            fi
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          lsof -ti :3113 2>/dev/null | xargs -r kill 2>/dev/null || true
          if [ "$HEALTHY" = "false" ]; then
            echo "::error::Smoke test failed: /api/health did not respond within 30s"
            exit 1
          fi
          echo "macOS smoke test passed"

      - uses: actions/upload-artifact@v7
        with:
          name: Cost-Dashboard-macOS-DMG
          path: dist-dmg/*.dmg
          retention-days: 7

  build-linux:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build Linux portable
        run: npm run build:portable:linux

      - name: Package Linux portable
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          cd dist-portable
          zip -r ../Cost-Dashboard-Linux-x64.zip . -x 'node/macos*' -x 'node/win*'

      - name: Verify Linux build
        run: |
          LINUX_ZIP="Cost-Dashboard-Linux-x64.zip"
          if [ ! -f "$LINUX_ZIP" ]; then echo "::error::Linux zip not found" && exit 1; fi
          LINUX_SIZE=$(du -m "$LINUX_ZIP" | cut -f1)
          echo "Linux: $LINUX_ZIP ($LINUX_SIZE MB)"
          if [ "$LINUX_SIZE" -lt 80 ]; then echo "::error::Linux zip too small ($LINUX_SIZE MB), expected >80 MB" && exit 1; fi
          if [ "$LINUX_SIZE" -gt 400 ]; then echo "::error::Linux zip too large ($LINUX_SIZE MB), expected <400 MB" && exit 1; fi
          REQUIRED_PATHS=(
            "app/server.bundle.js"
            "app/dist-frontend/index.html"
            "node/linux-x64/bin/node"
            "start.sh"
            "stop.sh"
            "README.txt"
          )
          for p in "${REQUIRED_PATHS[@]}"; do
            if ! unzip -l "$LINUX_ZIP" | grep -q "$p"; then echo "::error::Missing in zip: $p" && exit 1; fi
            echo "  OK: $p"
          done
          echo "Linux build verification passed"

      - name: Smoke test Linux build
        run: |
          export DB_MODE=sqljs
          export DB_PATH="$PWD/dist-portable/data/cost_dashboard.db"
          export UPLOADS_DIR="$PWD/dist-portable/uploads"
          export NODE_ENV=production
          export PORT=3113
          mkdir -p dist-portable/data dist-portable/uploads dist-portable/logs
          chmod +x dist-portable/node/linux-x64/bin/node
          dist-portable/node/linux-x64/bin/node dist-portable/app/server.bundle.js &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          HEALTHY=false
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://localhost:3113/api/health 2>/dev/null | grep -q '"success":true'; then
              HEALTHY=true
              echo "  OK: /api/health returned 200"
              break
            fi
            echo "  Waiting... (${i}s)"
          done
          if [ "$HEALTHY" = "true" ]; then
            if curl -sf http://localhost:3113/api/months 2>/dev/null > /dev/null; then
              echo "  OK: /api/months responded"
            fi
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          lsof -ti :3113 2>/dev/null | xargs -r kill 2>/dev/null || true
          if [ "$HEALTHY" = "false" ]; then
            echo "::error::Smoke test failed: /api/health did not respond within 30s"
            exit 1
          fi
          echo "Linux smoke test passed"

      - uses: actions/upload-artifact@v7
        with:
          name: Cost-Dashboard-Linux-x64
          path: Cost-Dashboard-Linux-x64.zip
          retention-days: 7

  build-android:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "Cost-Dashboard-Android-${VERSION}.apk"

      - name: Verify Android build
        run: |
          APK_FILE=$(ls Cost-Dashboard-Android-*.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then echo "::error::No APK file found" && exit 1; fi
          APK_SIZE=$(du -m "$APK_FILE" | cut -f1)
          echo "APK: $APK_FILE ($APK_SIZE MB)"
          if [ "$APK_SIZE" -lt 10 ]; then echo "::error::APK too small ($APK_SIZE MB), expected >10 MB" && exit 1; fi
          if [ "$APK_SIZE" -gt 100 ]; then echo "::error::APK too large ($APK_SIZE MB), expected <100 MB" && exit 1; fi
          if ! unzip -t "$APK_FILE" > /dev/null 2>&1; then echo "::error::APK is not a valid zip archive" && exit 1; fi
          echo "  OK: valid zip archive"
          AAPT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/aapt"
          BADGING=$($AAPT dump badging "$APK_FILE" 2>/dev/null)
          PKG=$(echo "$BADGING" | head -1 | grep -oP "name='\K[^']+" | head -1)
          VNAME=$(echo "$BADGING" | head -1 | grep -oP "versionName='\K[^']+")
          VCODE=$(echo "$BADGING" | head -1 | grep -oP "versionCode='\K[^']+")
          echo "  Package: $PKG"
          echo "  Version: $VNAME (code: $VCODE)"
          if [ "$PKG" != "com.yunshu.costdashboard" ]; then echo "::error::Unexpected package name: $PKG" && exit 1; fi
          EXPECTED_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$VNAME" != "$EXPECTED_VERSION" ]; then echo "::error::Version mismatch: APK=$VNAME, expected=$EXPECTED_VERSION" && exit 1; fi
          echo "  OK: package name and version correct"
          ASSETS=$($AAPT list "$APK_FILE" 2>/dev/null)
          for f in "assets/public/index.html" "classes.dex" "AndroidManifest.xml"; do
            if echo "$ASSETS" | grep -q "$f"; then
              echo "  OK: $f"
            else
              echo "::error::Missing in APK: $f" && exit 1
            fi
          done
          echo "Android build verification passed"

      - uses: actions/upload-artifact@v7
        with:
          name: Cost-Dashboard-Android-APK
          path: Cost-Dashboard-Android-*.apk
          retention-days: 7

  release:
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Verify release artifacts
        run: |
          ERRORS=""
          check_artifact() {
            local pattern="$1" min_mb="$2" max_mb="$3" label="$4"
            local file=$(ls $pattern 2>/dev/null | head -1)
            if [ -z "$file" ]; then
              ERRORS="${ERRORS}MISSING: ${label} (${pattern})\n"
              return
            fi
            local size_mb=$(du -m "$file" | cut -f1)
            echo "  $label: $(basename $file) ($size_mb MB)"
            if [ "$size_mb" -lt "$min_mb" ]; then
              ERRORS="${ERRORS}TOO SMALL: ${label} ($size_mb MB, expected >${min_mb} MB)\n"
            fi
            if [ "$size_mb" -gt "$max_mb" ]; then
              ERRORS="${ERRORS}TOO LARGE: ${label} ($size_mb MB, expected <${max_mb} MB)\n"
            fi
          }
          echo "Verifying release artifacts..."
          check_artifact "artifacts/Cost-Dashboard-Windows-x64/*.exe" 30 300 "Windows exe"
          check_artifact "artifacts/Cost-Dashboard-macOS-DMG/*.dmg" 80 400 "macOS DMG"
          check_artifact "artifacts/Cost-Dashboard-Linux-x64/*.zip" 80 400 "Linux zip"
          check_artifact "artifacts/Cost-Dashboard-Android-APK/*.apk" 10 100 "Android APK"
          if [ -n "$ERRORS" ]; then
            echo -e "::error::Artifact verification failed:\n$ERRORS"
            exit 1
          fi
          echo "All release artifacts verified"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get version
        id: version
        run: echo "tag=v$(node -e "console.log(require('./package.json').version)")" >> $GITHUB_OUTPUT

      - name: Force update tag to current commit
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            --jq '.body')
          {
            echo "notes<<RELEASE_EOF"
            echo "$NOTES"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            artifacts/Cost-Dashboard-Windows-x64/*.exe
            artifacts/Cost-Dashboard-macOS-DMG/*.dmg
            artifacts/Cost-Dashboard-Linux-x64/*.zip
            artifacts/Cost-Dashboard-Android-APK/*.apk
